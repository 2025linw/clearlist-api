name: Build and test

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/build-and-test-dev.yaml'
      - 'src/**'
      - 'Cargo.lock'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Build
      run: cargo build --bin clearlist-api

    - name: Run clippy
      run: cargo clippy --bin clearlist-api

    - name: Run tests
      run: cargo test --bin clearlist-api --verbose
