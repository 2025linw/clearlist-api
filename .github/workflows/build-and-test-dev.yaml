name: Build and test

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/build-and-test-dev.yaml'
      - 'src/**'
      - 'Cargo.lock'
      - './setup_dev.sql'
      - 'migrations/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Build dev binary
      run: cargo build

    - name: Run clippy
      run: cargo clippy

    - name: Bootstrap database for testing
      env:
        PGHOST: localhost
        PGDATABASE: testdb
        PGUSER: test
        PGPASSWORD: test
      run: |
        psql -v ON_ERROR_STOP=1 -f setup_dev.sql

    - name: Run tests
      env:
        MIGRATION_URL: postgresql://cl_migrate:cl_migrate@localhost:5432/testdb
        DATABASE_URL: postgresql://cl_api:cl_api@localhost:5432/testdb
      run: cargo test --verbose
