name: Build and deploy

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-and-deploy-main.yaml'
      - 'src/**'
      - 'Cargo.lock'
      - 'migrations/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Build release binary
      run: cargo build --release

    - name: Bootstrap database for testing
      env:
        PGHOST: localhost
        PGDATABASE: testdb
        PGUSER: test
        PGPASSWORD: test
      run: |
        psql -v ON_ERROR_STOP=1 -f setup_dev.sql

    - name: Run tests
      env:
        MIGRATION_URL: postgresql://cl_migrate:cl_migrate@localhost/testdb
        DATABASE_URL: postgresql://cl_api:cl_api@localhost/testdb
      run: cargo test --release --verbose

    - name: Connect to Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci

    - name: Upload binary to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        source: ./target/release/clearlist-api
        strip_components: 3
        target: /tmp/clearlist-api/

    - name: Move binary to working path
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: mv /tmp/clearlist-api/clearlist-api ${{ secrets.DEPLOY_PATH }}

    - name: Run database migration
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          ./clearlist-api migrate

    - name: Restart service
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          set -e

          sudo -n systemctl restart clearlist-api.service

          MAX_WAIT=10
          INTERVAL=2

          # Retry until active or timeout
          ELAPSED=0
          while ! sudo systemctl is-active --quiet clearlist-api.service; do
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
              if [ $ELAPSED -ge $MAX_WAIT ]; then
                  echo "Service failed to start after $MAX_WAIT seconds"
                  sudo journalctl -u clearlist-api.service -n 50 --no-pager
                  exit 1
              fi
          done
