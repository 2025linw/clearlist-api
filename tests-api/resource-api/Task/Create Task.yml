info:
  name: Create Task
  type: http
  seq: 2

http:
  method: POST
  url: "{{base-url}}/api/tasks"
  body:
    type: json
    data: |-
      {
        "title": "Test Title",
        "notes": "This is a sample note for 'Test Title'",
        "startDate": "2025-3-1",
        "startTime": "13:00",
        "deadline": "2025-4-1"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          let body = res.body;
          
          bru.setVar("task-id", body.data.taskId)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
