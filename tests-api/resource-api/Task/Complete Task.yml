info:
  name: Complete Task
  type: http
  seq: 6

http:
  method: PATCH
  url: "{{base-url}}/api/tasks/{{task-id}}/complete"
  body:
    type: json
    data: |-
      {
        "completed": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
