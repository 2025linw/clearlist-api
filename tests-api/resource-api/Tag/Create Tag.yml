info:
  name: Create Tag
  type: http
  seq: 2

http:
  method: POST
  url: "{{base-url}}/api/tags"
  body:
    type: json
    data: |-
      {
        "label": "Test Tag",
        "category": "Testing"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          let body = res.body;
          
          bru.setVar("tag-id", body.data.tagId)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
