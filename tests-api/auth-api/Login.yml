info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base-url}}/api/auth/sign-in/email"
  headers:
    - name: Origin
      value: "{{origin}}"
  body:
    type: json
    data: |-
      {
        "email": "testuser@email.com",
        "password": "testuser"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
