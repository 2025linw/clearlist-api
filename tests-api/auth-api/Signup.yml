info:
  name: Signup
  type: http
  seq: 1

http:
  method: POST
  url: "{{base-url}}/api/auth/sign-up/email"
  body:
    type: json
    data: |-
      {
        "email": "will@email.com",
        "password": "testpass",
        "name": "will"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
